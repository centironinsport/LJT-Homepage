name: Jekyll Build Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage" --destination ./_site
        env:
          JEKYLL_ENV: production
      - name: Verify generated pages
        run: |
          test -f ./_site/index.html
          test -f ./_site/publications/index.html
          grep -q "Junteng Liu" ./_site/index.html
          grep -q "SynLogic" ./_site/index.html
          grep -q "Natural language processing" ./_site/index.html
          grep -q "Vision4Chart" ./_site/publications/index.html
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: _site
